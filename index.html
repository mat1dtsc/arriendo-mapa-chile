<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ArriendoMapa · La verdad de la calle antes de arrendar</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;800;900&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --fondo:#0B1620; --panel:#101F2C; --panel2:#16293A; --borde:#223A4E;
  --texto:#ECF4F9; --sub:#8FB0C4;
  --agua:#41C6E0; --alerta:#FFC53D; --peligro:#FF5D4D; --ok:#3FD68F; --atento:#6EA8C9;
  --cauce:#2F86D6; --colector:#8F7BF0; --quebrada:#C9834F;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Archivo',system-ui,sans-serif;background:var(--fondo);color:var(--texto);overflow:hidden}
.mono{font-family:'IBM Plex Mono',monospace}

/* ── Barra superior ── */
#top{position:fixed;inset:0 0 auto 0;z-index:1000;background:linear-gradient(180deg,var(--fondo) 70%,transparent);padding:10px 12px 18px}
#brandrow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
#brand{font-weight:900;font-size:19px;letter-spacing:.5px;white-space:nowrap}
#brand b{color:var(--agua)}
#brand .cl{font-size:10px;background:var(--agua);color:#04222B;border-radius:4px;padding:1px 5px;vertical-align:3px;margin-left:4px;letter-spacing:1px}
#tagline{font-size:11px;color:var(--sub);letter-spacing:.2px;display:none}
@media(min-width:520px){#tagline{display:block}}
#buscar{flex:1;min-width:0;background:var(--panel);border:1px solid var(--borde);color:var(--texto);border-radius:10px;padding:9px 12px;font-size:14px;font-family:inherit;outline:none}
#buscar::placeholder{color:var(--sub)}
#buscar:focus{border-color:var(--agua)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--panel);border:1px solid var(--borde);color:var(--sub);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;user-select:none;transition:.15s;white-space:nowrap}
.chip:focus-visible{outline:2px solid var(--agua);outline-offset:2px}
.chip.on{background:var(--panel2);color:var(--texto);border-color:var(--agua)}
.chip.capa.on{color:var(--agua)}
#nres{font-size:11.5px;color:var(--sub);margin-top:6px}
#nres b{color:var(--texto)}

/* ── Mapa ── */
#map{position:fixed;inset:0;background:#d8e2e8}
.leaflet-control-attribution{font-size:9px;opacity:.75}

/* ── Marcadores ── */
.pulso{position:relative;width:16px;height:16px}
.pulso i{position:absolute;inset:3px;border-radius:50%;border:2px solid #fff}
.pulso::after{content:"";position:absolute;inset:0;border-radius:50%;animation:onda 2.4s ease-out infinite;opacity:.8}
@keyframes onda{0%{box-shadow:0 0 0 0 var(--co,rgba(65,198,224,.55))}100%{box-shadow:0 0 0 16px rgba(0,0,0,0)}}
@media (prefers-reduced-motion:reduce){.pulso::after{animation:none}}
.canal-anim{stroke-dasharray:8 7;animation:fluir 1.6s linear infinite}
@media (prefers-reduced-motion:reduce){.canal-anim{animation:none}}
@keyframes fluir{to{stroke-dashoffset:-15}}

/* ── Riel de tarjetas ── */
#riel{position:fixed;left:0;right:0;bottom:0;z-index:1000;padding:8px 10px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
#riel::-webkit-scrollbar{display:none}
.card{scroll-snap-align:start;flex:0 0 236px;background:var(--panel);border:1px solid var(--borde);border-radius:14px;padding:11px 12px;cursor:pointer;transition:border-color .15s}
.card:hover,.card:focus-visible{border-color:var(--agua);outline:none}
.card .precio{font-size:17px;font-weight:700}
.card .dir{font-size:12px;color:var(--sub);margin:3px 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badges{display:flex;gap:5px;flex-wrap:wrap}
.b{font-size:10.5px;font-weight:700;border-radius:6px;padding:2.5px 7px;letter-spacing:.2px}
.b.riesgo-alto{background:rgba(255,93,77,.16);color:var(--peligro)}
.b.riesgo-medio{background:rgba(255,197,61,.14);color:var(--alerta)}
.b.riesgo-atento{background:rgba(110,168,201,.15);color:var(--atento)}
.b.riesgo-bajo{background:rgba(63,214,143,.13);color:var(--ok)}
.b.loco{background:rgba(65,198,224,.13);color:var(--agua)}
.b.neutro{background:var(--panel2);color:var(--sub)}
.b.dev-ok{background:rgba(63,214,143,.13);color:var(--ok)}
.b.dev-mal{background:rgba(255,93,77,.14);color:var(--peligro)}

/* ── Ficha ── */
#velo{position:fixed;inset:0;background:rgba(4,10,15,.55);z-index:1500;display:none;backdrop-filter:blur(2px)}
#ficha{position:fixed;z-index:1600;background:var(--fondo);border:1px solid var(--borde);display:none;flex-direction:column;overflow:hidden;
  left:0;right:0;bottom:0;max-height:86%;border-radius:18px 18px 0 0}
@media(min-width:900px){#ficha{left:auto;top:12px;right:12px;bottom:12px;width:430px;max-height:none;border-radius:16px}}
#ficha.abierta,#velo.abierta{display:flex}
#velo.abierta{display:block}
#fclose{position:absolute;top:10px;right:10px;z-index:5;background:rgba(11,22,32,.85);border:1px solid var(--borde);color:var(--texto);width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer}
#fscroll{overflow-y:auto;padding-bottom:18px}
#ffotos{display:flex;gap:2px;height:170px;background:var(--panel)}
#ffotos img{flex:1;min-width:0;object-fit:cover}
#fbody{padding:14px 16px 6px}
#fprecio{font-size:26px;font-weight:700}
#fprecio small{font-size:13px;color:var(--sub);font-weight:500;font-family:'Archivo'}
#fdir{color:var(--sub);font-size:13.5px;margin:2px 0 10px}
.specs{display:flex;gap:14px;font-size:13px;color:var(--sub);margin-bottom:14px}
.specs b{color:var(--texto)}
h3.sec{font-size:11px;letter-spacing:2.2px;color:var(--sub);text-transform:uppercase;margin:16px 0 8px;font-weight:800}
.verd{background:var(--panel);border:1px solid var(--borde);border-radius:12px;padding:11px 12px;margin-bottom:8px;border-left:3px solid var(--borde)}
.verd.v-alto{border-left-color:var(--peligro)}
.verd.v-medio{border-left-color:var(--alerta)}
.verd.v-atento{border-left-color:var(--atento)}
.verd.v-bajo,.verd.v-ok{border-left-color:var(--ok)}
.verd.v-agua{border-left-color:var(--agua)}
.verd .tit{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:13.5px;margin-bottom:4px}
.verd .det{font-size:12.5px;color:var(--sub);line-height:1.55}
.verd .det b{color:var(--texto)}
.verd .fuente{font-size:10px;color:#5E7D92;margin-top:6px}
.recs{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.rec{font-size:10.5px;background:var(--panel2);border-radius:5px;padding:2px 6px;color:var(--agua);font-weight:700}
#flink{display:block;text-align:center;background:var(--agua);color:#04222B;font-weight:800;border-radius:11px;padding:12px;margin:14px 16px 4px;text-decoration:none;font-size:14px}
#fnota{font-size:12px;color:var(--sub);padding:0 16px;text-align:center}
.amen-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}

/* ── Leyenda ── */
#leyenda{position:fixed;right:10px;bottom:120px;z-index:900;background:rgba(16,31,44,.92);border:1px solid var(--borde);border-radius:10px;padding:9px 11px;font-size:10.5px;color:var(--sub);display:none;line-height:1.9}
#leyenda.v{display:block}
#leyenda i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:-1px}
@media(min-width:900px){#riel{left:0;right:auto;top:152px;bottom:0;width:280px;flex-direction:column;overflow-y:auto;scroll-snap-type:none;padding:6px 10px 20px}
  .card{flex:0 0 auto}
  #leyenda{bottom:14px}}
</style>
</head>
<body>

<div id="map" role="application" aria-label="Mapa de arriendos"></div>

<header id="top">
  <div id="brandrow">
    <div id="brand">ARRIENDO<b>MAPA</b><span class="cl">CL</span></div>
    <span id="tagline">La verdad de la calle antes de arrendar</span>
    <input id="buscar" type="search" placeholder="Buscar sector, comuna, característica…" aria-label="Buscar">
  </div>
  <div class="chips" id="chips-capas" aria-label="Capas del mapa">
    <button class="chip capa on" data-capa="inund">💧 Inundación</button>
    <button class="chip capa" data-capa="parad">🚌 Paraderos</button>
    <button class="chip capa" data-capa="metro">Ⓜ️ Metro</button>
  </div>
  <div class="chips" id="chips-filtros" style="margin-top:6px" aria-label="Filtros">
    <button class="chip" data-f="p450">≤ $450 mil</button>
    <button class="chip" data-f="p600">≤ $600 mil</button>
    <button class="chip" data-f="d3">3+ dorm</button>
    <button class="chip" data-f="seguro">💧 Sin riesgo alto</button>
    <button class="chip" data-f="conectado">🚌 Bien conectada</button>
    <select id="selcomuna" class="chip" aria-label="Comuna"><option value="">Todas las comunas</option></select>
  </div>
  <div id="nres"></div>
</header>

<div id="leyenda">
  <b style="color:var(--texto)">Puntos críticos GORE RM</b><br>
  <i style="background:var(--cauce)"></i>Desborde de cauce<br>
  <i style="background:var(--agua)"></i>Anegamiento de calles<br>
  <i style="background:var(--colector)"></i>Colapso de colectores<br>
  <i style="background:var(--quebrada)"></i>Quebrada / aluvión<br>
  <span style="display:inline-block;width:14px;border-top:2px dashed var(--agua);margin-right:4px;vertical-align:3px"></span>Canales
</div>

<nav id="riel" aria-label="Resultados"></nav>

<div id="velo"></div>
<aside id="ficha" aria-modal="true" role="dialog">
  <button id="fclose" aria-label="Cerrar">✕</button>
  <div id="fscroll">
    <div id="ffotos"></div>
    <div id="fbody"></div>
    <a id="flink" target="_blank" rel="noopener">Ver aviso original ↗</a>
    <p id="fnota"></p>
  </div>
</aside>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="datos.js"></script>
<script>
function ARRANQUE(){
const $ = s => document.querySelector(s);
const fmt = n => '$' + n.toLocaleString('es-CL');
const fdist = m => m < 1000 ? m + ' m' : (m/1000).toFixed(1).replace('.',',') + ' km';

/* ── Puntajes ── */
function scoreLoco(t){
  if(!t || t.metro_m == null) return null;
  let s = 0;
  const m = t.metro_m;
  s += m<=600?35 : m<=1000?30 : m<=1600?22 : m<=2600?12 : 4;
  s += Math.min(30, (t.n_recorridos||0)*2.5);
  s += Math.min(20, (t.buses_hora_punta||0)/6);
  const pm = t.paradero_min_m;
  s += pm==null?0 : pm<=250?15 : pm<=400?10 : pm<=600?5 : 0;
  return Math.round(Math.min(100,s));
}
const nivelLoco = s => s==null?['s/d','neutro'] : s>=75?['Excelente','loco'] : s>=55?['Buena','loco'] : s>=35?['Media','neutro'] : ['Baja','neutro'];
const NIV = {alto:['ALTO','v-alto'], medio:['MEDIO','v-medio'], atento:['ATENTO','v-atento'], bajo:['BAJO','v-bajo']};
function grupoCausa(c){
  c = c.toLowerCase();
  if(c.includes('cauce')) return ['cauce','#2F86D6'];
  if(c.includes('colector')) return ['colector','#8F7BF0'];
  if(c.includes('quebrada')||c.includes('aluvi')||c.includes('barro')) return ['quebrada','#C9834F'];
  return ['anegamiento','#41C6E0'];
}

/* ── Mapa ── */
const map = L.map('map',{zoomControl:false}).setView([-33.55,-70.60],12);
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
  {attribution:'© OpenStreetMap · CARTO · GORE RM · DTPM', maxZoom:19}).addTo(map);

/* Capa inundación */
const capaInund = L.layerGroup();
DATOS.canales && Object.entries(DATOS.canales).forEach(([nom,segs])=>{
  segs.forEach(seg=>{
    if(seg.length<2) return;
    L.polyline(seg,{color:'#41C6E0',weight:3,opacity:.85,className:'canal-anim'})
      .bindTooltip(nom,{sticky:true}).addTo(capaInund);
  });
});
DATOS.pc.forEach(p=>{
  const [,color] = grupoCausa(p.causa);
  const ic = L.divIcon({className:'', iconSize:[16,16],
    html:`<div class="pulso" style="--co:${color}66"><i style="background:${color}"></i></div>`});
  L.marker([p.lat,p.lon],{icon:ic})
    .bindPopup(`<b>${p.sector}</b><br>${p.causa}<br><small>${p.comuna}${p.aprox?' · ubicación aprox.':''} · Fuente: ${DATOS.meta.fuente_pc}</small>`)
    .addTo(capaInund);
});
capaInund.addTo(map);
$('#leyenda').classList.add('v');

/* Capa paraderos */
const capaParad = L.layerGroup();
DATOS.paraderos.forEach(p=>{
  L.circleMarker([p.lat,p.lon],{radius:3,color:'#0B1620',weight:1,fillColor:'#FFC53D',fillOpacity:.95})
    .bindPopup(`<b>${p.c}</b> · ${p.n}<br><small>Recorridos: ${p.r.join(', ')||'s/d'}</small>`)
    .addTo(capaParad);
});

/* Capa metro */
const capaMetro = L.layerGroup();
DATOS.lineas.forEach(l=>l.tramos.forEach(tr=>{
  if(tr.length>1) L.polyline(tr,{color:l.color,weight:3,opacity:.8}).addTo(capaMetro);
}));
DATOS.metro.forEach(m=>{
  L.circleMarker([m.lat,m.lon],{radius:4,color:'#fff',weight:1.5,fillColor:'#111',fillOpacity:1})
    .bindTooltip(m.name).addTo(capaMetro);
});

/* ── Estado y filtros ── */
const F = {p450:false,p600:false,d3:false,seguro:false,conectado:false,comuna:'',q:''};
const comunas = [...new Set(DATOS.casas.map(c=>c.comuna))].sort();
comunas.forEach(c=>{const o=document.createElement('option');o.value=o.textContent=c;$('#selcomuna').append(o);});

let marcadores = L.layerGroup().addTo(map);
function filtrar(){
  const q = F.q.toLowerCase();
  return DATOS.casas.filter(c=>{
    if(F.p450 && c.precio>450000) return false;
    if(F.p600 && c.precio>600000) return false;
    if(F.d3 && c.dorm<3) return false;
    if(F.seguro && c.r.nivel==='alto') return false;
    if(F.conectado && (scoreLoco(c.t)||0) < 55) return false;
    if(F.comuna && c.comuna!==F.comuna) return false;
    if(q && !(`${c.sector} ${c.comuna} ${c.nota} ${c.corr}`.toLowerCase().includes(q))) return false;
    return true;
  });
}
const colRiesgo = {alto:'#FF5D4D',medio:'#FFC53D',atento:'#6EA8C9',bajo:'#3FD68F'};

function render(){
  const res = filtrar();
  marcadores.clearLayers();
  res.forEach(c=>{
    L.circleMarker([c.lat,c.lon],{radius:7,color:'#0B1620',weight:2,
      fillColor:colRiesgo[c.r.nivel],fillOpacity:.95})
      .on('click',()=>abrirFicha(c)).addTo(marcadores);
  });
  const riel = $('#riel'); riel.innerHTML='';
  res.forEach(c=>{
    const s = scoreLoco(c.t), [ln] = nivelLoco(s);
    const dev = c.dev==null?'' : `<span class="b ${c.dev<=-5?'dev-ok':c.dev>=8?'dev-mal':'neutro'}">${c.dev>0?'+':''}${c.dev}% /m²</span>`;
    const el = document.createElement('button');
    el.className='card';
    el.innerHTML = `<div class="precio mono">${fmt(c.precio)}</div>
      <div class="dir">${c.sector} · ${c.comuna}</div>
      <div class="badges">
        <span class="b riesgo-${c.r.nivel}">💧 ${NIV[c.r.nivel][0]}</span>
        <span class="b loco">🚌 ${ln}${s!=null?' '+s:''}</span>
        <span class="b neutro">${c.dorm}D·${c.banos}B·${c.m2}m²</span>${dev}
      </div>`;
    el.onclick = ()=>{ map.flyTo([c.lat,c.lon],15,{duration:.7}); abrirFicha(c); };
    riel.append(el);
  });
  $('#nres').innerHTML = `<b>${res.length}</b> de ${DATOS.casas.length} avisos · datos reales jul-2026 · capa inundación: ${DATOS.pc.length} puntos críticos oficiales`;
}

/* ── Ficha ── */
function abrirFicha(c){
  $('#ffotos').innerHTML = (c.fotos||[]).map(f=>`<img src="${f}" alt="" loading="lazy">`).join('');
  $('#ffotos').style.display = (c.fotos&&c.fotos.length)?'flex':'none';
  const s = scoreLoco(c.t), [ln] = nivelLoco(s);
  const t = c.t||{}, r = c.r;
  const amen = c.amen ? Object.entries(c.amen).filter(([,v])=>v).map(([k])=>({estac:'Estacionamiento',mascotas:'Acepta mascotas',piscina:'Piscina',condominio:'Condominio'}[k]||k)) : [];
  const canalLinea = r.canal ? `<br><b>${r.canal}</b> a <b class="mono">${fdist(r.canal_m)}</b> de la propiedad.` : '';
  $('#fbody').innerHTML = `
    <div id="fprecio" class="mono">${fmt(c.precio)}<small> /mes</small></div>
    <div id="fdir">${c.sector} · ${c.comuna} · ${c.corr}${c.estado==='verificado'?' · ✓ verificado':''}</div>
    <div class="specs"><span><b>${c.dorm}</b> dorm</span><span><b>${c.banos}</b> baños</span><span><b>${c.m2}</b> m²</span><span class="mono"><b>${c.pxm?('$'+c.pxm.toLocaleString('es-CL')):'—'}</b>/m²</span></div>
    ${amen.length?`<div class="amen-tags">${amen.map(a=>`<span class="b neutro">${a}</span>`).join('')}</div>`:''}
    <h3 class="sec">Informe crítico</h3>
    <div class="verd ${NIV[r.nivel][1]}">
      <div class="tit"><span>💧 Riesgo de invierno</span><span class="b riesgo-${r.nivel}">${NIV[r.nivel][0]}</span></div>
      <div class="det">Punto crítico más cercano a <b class="mono">${fdist(r.pc_m)}</b>: <b>${r.pc_sector}</b> — ${r.pc_causa.toLowerCase()}${r.pc_aprox?' <i>(ubicación aprox.)</i>':''}.${canalLinea}</div>
      <div class="fuente">Fuente: ${DATOS.meta.fuente_pc} · referencial, no es un certificado de riesgo</div>
    </div>
    <div class="verd v-agua">
      <div class="tit"><span>🚌 Locomoción real</span><span class="b loco">${ln}${s!=null?' · '+s+'/100':''}</span></div>
      <div class="det"><b>${t.n_recorridos??'—'}</b> recorridos en 500 m · <b class="mono">${t.buses_hora_punta??'—'}</b> buses/h en punta · paradero a <b class="mono">${t.paradero_min_m!=null?fdist(t.paradero_min_m):'—'}</b> · Metro <b>${t.metro_est||'—'}</b> a <b class="mono">${t.metro_m!=null?fdist(t.metro_m):'—'}</b>
      ${t.recorridos&&t.recorridos.length?`<div class="recs">${t.recorridos.slice(0,10).map(x=>`<span class="rec">${x}</span>`).join('')}</div>`:''}</div>
      <div class="fuente">Fuente: ${DATOS.meta.fuente_gtfs} (paraderos, recorridos y frecuencias)</div>
    </div>
    <div class="verd ${c.dev==null?'':(c.dev<=-5?'v-ok':c.dev>=8?'v-alto':'')}">
      <div class="tit"><span>💰 Precio vs comuna</span>${c.dev!=null?`<span class="b ${c.dev<=-5?'dev-ok':c.dev>=8?'dev-mal':'neutro'}">${c.dev>0?'+':''}${c.dev}%</span>`:''}</div>
      <div class="det">${c.dev==null?'Sin m² informados para comparar.':`Este arriendo está <b>${c.dev>0?c.dev+'% sobre':Math.abs(c.dev)+'% bajo'}</b> la mediana de $/m² de ${c.comuna} (mediana: <b class="mono">$${(DATOS.meta.medianas_pxm[c.comuna]||0).toLocaleString('es-CL')}/m²</b>, calculada con los avisos de esta plataforma).`}</div>
    </div>`;
  $('#flink').href = c.link;
  $('#fnota').textContent = c.nota || '';
  $('#ficha').classList.add('abierta'); $('#velo').classList.add('abierta');
}
const cerrar = ()=>{$('#ficha').classList.remove('abierta');$('#velo').classList.remove('abierta');};
$('#fclose').onclick = cerrar; $('#velo').onclick = cerrar;
document.addEventListener('keydown',e=>{if(e.key==='Escape')cerrar();});

/* ── Interacción chips ── */
document.querySelectorAll('#chips-filtros .chip[data-f]').forEach(ch=>{
  ch.onclick = ()=>{ F[ch.dataset.f]=!F[ch.dataset.f]; ch.classList.toggle('on'); render(); };
});
$('#selcomuna').onchange = e=>{ F.comuna=e.target.value; render(); };
$('#buscar').oninput = e=>{ F.q=e.target.value; render(); };
document.querySelectorAll('.chip.capa').forEach(ch=>{
  ch.onclick = ()=>{
    ch.classList.toggle('on');
    const on = ch.classList.contains('on');
    const capa = {inund:capaInund,parad:capaParad,metro:capaMetro}[ch.dataset.capa];
    on ? capa.addTo(map) : map.removeLayer(capa);
    if(ch.dataset.capa==='inund') $('#leyenda').classList.toggle('v',on);
  };
});

render();
}

  } else setTimeout(go,150); }
