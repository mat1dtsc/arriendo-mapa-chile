<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArriendoMapa Chile · Encuentra tu casa en arriendo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{ --bg:#f4f6f9; --panel:#ffffff; --line:#e2e8f0; --txt:#17223b; --mut:#64748b;
         --acc:#2E5E8C; --acc2:#ffd54a; }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%; background:var(--bg); color:var(--txt); font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden}
  #app{display:flex; height:100%}
  #side{width:400px; min-width:400px; background:var(--panel); border-right:1px solid var(--line);
    display:flex; flex-direction:column; z-index:20; box-shadow:2px 0 16px rgba(0,0,0,.06)}
  #brand{padding:14px 18px 10px; display:flex; align-items:center; gap:10px}
  #brand .logo{width:34px; height:34px; background:var(--acc); color:#fff; border-radius:10px;
    display:flex; align-items:center; justify-content:center; font-size:18px}
  #brand h1{font-size:17px; font-weight:800}
  #brand h1 span{color:var(--acc)}
  #brand p{font-size:11px; color:var(--mut)}
  #searchbox{padding:0 14px 10px; position:relative}
  #q{width:100%; padding:11px 40px 11px 14px; border:1.5px solid var(--line); border-radius:12px;
    font-size:14px; outline:none; transition:.15s}
  #q:focus{border-color:var(--acc); box-shadow:0 0 0 3px rgba(46,94,140,.12)}
  #qbtn{position:absolute; right:22px; top:8px; background:none; border:none; font-size:17px; cursor:pointer; color:var(--acc)}
  #chips{padding:0 14px 8px; display:flex; flex-wrap:wrap; gap:6px}
  .chip{font-size:11.5px; padding:5px 11px; border-radius:20px; border:1px solid var(--line);
    background:#f8fafc; cursor:pointer; color:var(--mut); transition:.15s}
  .chip:hover{border-color:var(--acc); color:var(--acc)}
  .chip.on{background:var(--acc); color:#fff; border-color:var(--acc)}
  #filtros{padding:8px 14px 10px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); background:#fbfcfe}
  .fsec{font-size:10.5px; font-weight:800; color:var(--acc); text-transform:uppercase; letter-spacing:.8px;
    margin:12px 0 2px; padding-top:8px; border-top:1px solid var(--line)}
  .fsec:first-child{border-top:none; padding-top:0; margin-top:2px}
  .frow{display:flex; align-items:center; gap:10px; margin:7px 0}
  .frow label{font-size:11.5px; color:var(--mut); width:92px; flex-shrink:0}
  .frow input[type=range]{flex:1; accent-color:var(--acc); height:3px}
  .frow .val{font-size:12px; font-weight:700; width:78px; text-align:right}
  .frow select{flex:1; padding:5px 8px; border:1px solid var(--line); border-radius:8px; font-size:12.5px; background:#fff}
  .seg{display:flex; gap:4px; flex:1}
  .seg button{flex:1; padding:5px 0; font-size:11.5px; font-weight:700; border:1px solid var(--line);
    background:#fff; border-radius:8px; cursor:pointer; color:var(--mut); transition:.12s}
  .seg button.on{background:var(--acc); color:#fff; border-color:var(--acc)}
  .seg button:hover:not(.on){border-color:var(--acc); color:var(--acc)}
  #amen{display:flex; flex-direction:column; gap:6px; margin:4px 0}
  #amen label{display:flex; align-items:center; gap:7px; font-size:12.5px; cursor:pointer; color:var(--txt)}
  #amen input{accent-color:var(--acc)}
  #limpiar{width:100%; margin-top:12px; padding:9px 0; background:#f1f5f9; border:1px solid var(--line);
    border-radius:10px; font-size:12.5px; font-weight:700; color:var(--mut); cursor:pointer}
  #limpiar:hover{border-color:var(--acc); color:var(--acc)}
  .stars{color:#f5b301; font-size:12px; letter-spacing:1px}
  #capas{padding:6px 14px 10px; display:flex; gap:14px; font-size:12px; color:var(--mut)}
  #capas label{display:flex; align-items:center; gap:5px; cursor:pointer}
  #capas input{accent-color:var(--acc)}
  #results{flex:1; overflow-y:auto; padding:10px 14px}
  #resumen{font-size:12px; color:var(--mut); padding:4px 2px 10px}
  .card{border:1px solid var(--line); border-radius:14px; margin-bottom:12px; overflow:hidden; cursor:pointer;
    transition:.15s; background:#fff}
  .card:hover{border-color:var(--acc); box-shadow:0 4px 18px rgba(46,94,140,.15); transform:translateY(-1px)}
  .card .img{height:150px; background:#0d1626 center/cover; position:relative}
  .card .img .precio{position:absolute; left:10px; bottom:10px; background:rgba(13,22,38,.92); color:var(--acc2);
    font-weight:800; font-size:16px; padding:4px 12px; border-radius:10px}
  .card .cbody{padding:10px 14px 12px}
  .card .sector{font-size:13px; font-weight:700; margin-bottom:4px}
  .card .specs{font-size:12px; color:var(--mut); display:flex; gap:12px; margin-bottom:6px}
  .card .loco{font-size:11.5px; color:var(--mut); display:flex; align-items:center; gap:6px}
  .card .loco b{color:var(--txt)}
  .badge2{position:absolute; right:10px; top:10px; font-size:10px; font-weight:800; padding:3px 8px; border-radius:8px; background:rgba(255,255,255,.92)}
  .b2-ver{color:#0f9d6c} .b2-rev{color:#d97706} .b2-lis{color:#64748b} .b2-des{color:#94a3b8}
  #map{flex:1; position:relative}
  .leaflet-container{background:#e8eef3}
  .pin{display:flex; flex-direction:column; align-items:center}
  .pin .tag{background:#17223b; color:#fff; font-size:10.5px; font-weight:800; padding:2px 8px;
    border-radius:9px; white-space:nowrap; box-shadow:0 2px 8px rgba(0,0,0,.3); margin-bottom:2px}
  .pin .dot{width:15px; height:15px; border-radius:50%; border:2.5px solid #fff; box-shadow:0 2px 8px rgba(0,0,0,.35)}
  .m-name2{font-size:9px; font-weight:700; color:#17223b; background:rgba(255,255,255,.88);
    padding:1px 5px; border-radius:4px; white-space:nowrap; box-shadow:0 1px 3px rgba(0,0,0,.18)}
  #ficha{position:absolute; z-index:30; top:0; right:-420px; width:400px; max-width:94vw; height:100%;
    background:var(--panel); transition:right .28s ease; overflow-y:auto; box-shadow:-14px 0 44px rgba(0,0,0,.18)}
  #ficha.open{right:0}
  #ficha .gal{position:relative; height:230px; background:#0d1626}
  #ficha .gal img{width:100%; height:230px; object-fit:cover; display:block}
  #ficha .gal .nav{position:absolute; top:50%; transform:translateY(-50%); background:rgba(0,0,0,.5); color:#fff;
    border:none; width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:17px}
  #ficha .gal .prev{left:8px} #ficha .gal .next{right:8px}
  #ficha .gal .cnt{position:absolute; bottom:8px; right:10px; background:rgba(0,0,0,.6); font-size:10px; padding:2px 8px; border-radius:8px; color:#fff}
  #ficha .fbody{padding:16px 18px 24px}
  #ficha .precio{font-size:26px; font-weight:800; color:var(--acc)}
  #ficha .precio small{font-size:13px; color:var(--mut); font-weight:500}
  #ficha .sector{font-size:14px; font-weight:700; margin:3px 0 10px}
  #ficha .specs{display:flex; gap:16px; margin-bottom:12px; font-size:13.5px}
  .scorebox{background:#f8fafc; border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:12px}
  .scorebox h4{font-size:11px; color:var(--mut); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px}
  .scorerow{display:flex; align-items:center; gap:10px; margin:7px 0; font-size:12.5px}
  .scorerow .lbl{width:110px; color:var(--mut)}
  .bar{flex:1; height:7px; background:#e2e8f0; border-radius:6px; overflow:hidden}
  .bar i{display:block; height:100%; background:linear-gradient(90deg,#5B9E6D,#34d399); border-radius:6px}
  .scorerow .num{width:34px; text-align:right; font-weight:800}
  .scorerow .st{width:78px; text-align:right}
  .nota2{font-size:12px; color:var(--mut); margin-bottom:10px}
  .calles{font-size:12px; color:var(--mut); margin-bottom:12px}
  .calles b{color:var(--txt)}
  .calles .cl{display:inline-block; background:#eef2f7; border-radius:7px; padding:2px 8px; margin:2px 3px 0 0; font-size:11.5px}
  .badge{display:inline-block; font-size:10.5px; font-weight:800; padding:3px 9px; border-radius:8px; margin-bottom:12px}
  .b-ver{background:rgba(52,211,153,.15); color:#0f9d6c; border:1px solid rgba(52,211,153,.4)}
  .b-lis{background:rgba(100,116,139,.12); color:var(--mut); border:1px solid var(--line)}
  .b-rev{background:rgba(251,146,60,.15); color:#d97706; border:1px solid rgba(251,146,60,.4)}
  .b-des{background:rgba(100,116,139,.18); color:#64748b; border:1px solid #cbd5e1}
  #ficha .btn{display:block; text-align:center; background:var(--acc); color:#fff; font-weight:800; font-size:14px;
    padding:12px 0; border-radius:11px; text-decoration:none; margin-bottom:8px}
  #ficha .btn:hover{filter:brightness(1.08)}
  #ficha .corr{font-size:11px; color:var(--mut); text-align:center}
  #cerrar{position:absolute; top:10px; left:10px; z-index:2; background:rgba(0,0,0,.5); color:#fff; border:none;
    width:32px; height:32px; border-radius:50%; font-size:16px; cursor:pointer}
  #hamb{display:none; position:absolute; z-index:25; top:12px; left:12px; background:#fff; border:1px solid var(--line);
    border-radius:10px; padding:8px 12px; font-size:16px; cursor:pointer; box-shadow:0 2px 10px rgba(0,0,0,.12)}
  @media (max-width:860px){
    #side{position:absolute; left:-420px; top:0; bottom:0; transition:left .28s ease; z-index:25}
    #side.open{left:0}
    #hamb{display:block}
  }
</style>
</head>
<body>
<div id="app">
  <button id="hamb" onclick="document.getElementById('side').classList.toggle('open')">☰</button>

  <div id="side">
    <div id="brand">
      <div class="logo">🏠</div>
      <div>
        <h1>Arriendo<span>Mapa</span> Chile</h1>
        <p>Plataforma gratuita de búsqueda de arriendos</p>
      </div>
    </div>
    <div id="searchbox">
      <input id="q" type="text" placeholder="Prueba: “3 dormitorios en Ñuñoa hasta 800 mil cerca del metro”">
      <button id="qbtn" onclick="buscar()">🔍</button>
    </div>
    <div id="chips">
      <span class="chip" onclick="chip(this,'baratas')">Más baratas</span>
      <span class="chip" onclick="chip(this,'locomocion')">Mejor locomoción</span>
      <span class="chip" onclick="chip(this,'metros')">Más grandes</span>
      <span class="chip" onclick="chip(this,'verificadas')">Precio verificado</span>
      <span class="chip" onclick="chip(this,'4d')">4 dormitorios</span>
    </div>
    <div id="filtros">
      <div class="fsec">💰 Precio mensual</div>
      <div class="frow">
        <label>Desde</label>
        <input type="range" id="fPMin" min="350000" max="1800000" step="25000" value="350000" oninput="aplicar()">
        <span class="val" id="vPMin">$350 mil</span>
      </div>
      <div class="frow">
        <label>Hasta</label>
        <input type="range" id="fPrecio" min="350000" max="1800000" step="25000" value="1800000" oninput="aplicar()">
        <span class="val" id="vPrecio">$1,8 M</span>
      </div>
      <div class="fsec">🏠 La propiedad</div>
      <div class="frow">
        <label>Dormitorios</label>
        <div class="seg" id="segDorm">
          <button class="on" data-v="1" onclick="seg(this,'dorm')">1+</button><button data-v="2" onclick="seg(this,'dorm')">2+</button><button data-v="3" onclick="seg(this,'dorm')">3+</button><button data-v="4" onclick="seg(this,'dorm')">4+</button>
        </div>
      </div>
      <div class="frow">
        <label>Baños</label>
        <div class="seg" id="segBanos">
          <button class="on" data-v="1" onclick="seg(this,'banos')">1+</button><button data-v="2" onclick="seg(this,'banos')">2+</button><button data-v="3" onclick="seg(this,'banos')">3+</button>
        </div>
      </div>
      <div class="frow">
        <label>Superficie mín.</label>
        <input type="range" id="fM2" min="40" max="150" step="5" value="40" oninput="aplicar()">
        <span class="val" id="vM2">40 m²</span>
      </div>
      <div class="fsec">📍 Zona y conectividad</div>
      <div class="frow">
        <label>Comuna</label>
        <select id="fComuna" onchange="aplicar()"><option value="">Todas (RM)</option></select>
      </div>
      <div class="frow">
        <label>Locomoción mín.</label>
        <input type="range" id="fLoco" min="1" max="5" step="0.5" value="1" oninput="aplicar()">
        <span class="val" id="vLoco">1+ ★</span>
      </div>
      <div class="frow">
        <label>Metro a menos de</label>
        <select id="fMetro" onchange="aplicar()">
          <option value="99">Cualquier distancia</option>
          <option value="0.5">500 m (caminando)</option>
          <option value="1">1 km</option>
          <option value="2">2 km</option>
          <option value="4">4 km</option>
        </select>
      </div>
      <div class="fsec">✨ Amenidades</div>
      <div id="amen">
        <label><input type="checkbox" id="aEstac" onchange="aplicar()"> 🚗 Estacionamiento</label>
        <label><input type="checkbox" id="aMascotas" onchange="aplicar()"> 🐾 Admite mascotas</label>
        <label><input type="checkbox" id="aPiscina" onchange="aplicar()"> 🏊 Piscina</label>
        <label><input type="checkbox" id="aCondo" onchange="aplicar()"> 🏘️ Condominio / pasaje cerrado</label>
      </div>
      <div class="fsec">🔎 Tipo de aviso</div>
      <div id="amen">
        <label><input type="checkbox" id="aVerif" onchange="aplicar()"> ✅ Solo precio verificado</label>
        <label><input type="checkbox" id="aFotos" onchange="aplicar()"> 📷 Solo con fotos reales</label>
      </div>
      <button id="limpiar" onclick="limpiar()">↺ Limpiar todos los filtros</button>
    </div>
    <div id="capas">
      <label><input type="checkbox" id="cMetro" checked onchange="capas()"> 🚇 Estaciones</label>
      <label><input type="checkbox" id="cLineas" checked onchange="capas()"> 🛤️ Líneas Metro</label>
      <label><input type="checkbox" id="cPrecios" checked onchange="capas()"> 🏷️ Precios</label>
    </div>
    <div id="results"><div id="resumen"></div></div>
  </div>

  <div id="map"></div>

  <div id="ficha">
    <button id="cerrar" onclick="cerrarFicha()">✕</button>
    <div class="gal" id="f-gal"></div>
    <div class="fbody" id="f-body"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data.js"></script>
<script>
// Descomprimir el dataset (zlib+base64) sin librerías externas
async function cargarData(){
  const bytes = Uint8Array.from(atob(DATA_B64), ch=>ch.charCodeAt(0));
  const ds = new DecompressionStream("deflate");
  const stream = new Blob([bytes]).stream().pipeThrough(ds);
  const texto = await new Response(stream).text();
  return JSON.parse(texto);
}
let CASAS=[], METRO=[], LINEAS=[];

cargarData().then(d=>{
  CASAS = d.casas; METRO = d.metro; LINEAS = d.lineas;
  iniciarApp();
}).catch(err=>{
  document.getElementById("resumen").textContent = "Error cargando datos: "+err;
});

function iniciarApp(){
const fmt = n => "$" + n.toLocaleString("es-CL");
const fmtK = n => n>=1000000 ? "$"+(n/1000000).toLocaleString("es-CL")+" M" : "$"+Math.round(n/1000)+" mil";
const colorPrecio = c => c.estado==="despublicado" ? "#94a3b8" : (c.precio<=500000 ? "#0f9d6c" : (c.precio<=650000 ? "#b07417" : "#c2410c"));
const stars = n => "★".repeat(Math.round(n)) + "☆".repeat(5-Math.round(n));
const badge = e => e==="verificado" ? '<span class="badge b-ver">✅ Precio verificado</span>'
  : e==="verificar" ? '<span class="badge b-rev">⚠️ Confirmar precio</span>'
  : e==="despublicado" ? '<span class="badge b-des">Publicación eliminada</span>'
  : '<span class="badge b-lis">Precio del listado</span>';
const badge2 = e => e==="verificado" ? '<span class="badge2 b2-ver">✅ verificado</span>'
  : e==="verificar" ? '<span class="badge2 b2-rev">⚠️ confirmar</span>'
  : e==="despublicado" ? '<span class="badge2 b2-des">eliminado</span>'
  : '<span class="badge2 b2-lis">listado</span>';

const map = L.map("map", {zoomControl:false}).setView([-33.45,-70.66], 11);
L.control.zoom({position:"bottomright"}).addTo(map);
L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
  attribution:'© OpenStreetMap · © CARTO · Transporte: OSM', maxZoom:19
}).addTo(map);

const layerMetro = L.layerGroup().addTo(map);
const layerLineas = L.layerGroup().addTo(map);
LINEAS.forEach(l=>{
  l.tramos.forEach(tramo=>{
    L.polyline(tramo, {color:"#ffffff", weight:6, opacity:.9, interactive:false}).addTo(layerLineas);
  });
});
LINEAS.forEach(l=>{
  l.tramos.forEach(tramo=>{
    L.polyline(tramo, {color:l.color, weight:3.5, opacity:.95, interactive:false}).addTo(layerLineas);
  });
});
const layerEstNombres = L.layerGroup();
METRO.forEach(m=>{
  L.circleMarker([m.lat,m.lon], {radius:4.5, color:"#fff", weight:2, fillColor:"#17223b",
    fillOpacity:1, interactive:false}).addTo(layerMetro);
  L.marker([m.lat,m.lon], {icon:L.divIcon({className:"",
    html:`<span class="m-name2">${m.name}</span>`, iconSize:null, iconAnchor:[-6,7]}),
    interactive:false}).addTo(layerEstNombres);
});
function syncNombres(){
  if (map.getZoom() >= 13 && document.getElementById("cMetro").checked) layerEstNombres.addTo(map);
  else map.removeLayer(layerEstNombres);
}

const markers = {};
let filtradas = [...CASAS];
function pintarMarcadores(){
  Object.values(markers).forEach(m=>map.removeLayer(m));
  for (const k in markers) delete markers[k];
  const showTags = document.getElementById("cPrecios").checked && map.getZoom() >= 12;
  filtradas.forEach(c=>{
    const tag = showTags ? `<span class="tag">${fmtK(c.precio)}</span>` : "";
    const icon = L.divIcon({className:"",
      html:`<div class="pin">${tag}<span class="dot" style="background:${colorPrecio(c)}"></span></div>`,
      iconSize:[15,15], iconAnchor:[7,22]});
    markers[c.id] = L.marker([c.lat,c.lon], {icon}).addTo(map).on("click", ()=>abrirFicha(c));
  });
}
map.on("zoomend", ()=>{ syncNombres(); pintarMarcadores(); });
function capas(){
  document.getElementById("cMetro").checked ? layerMetro.addTo(map) : map.removeLayer(layerMetro);
  document.getElementById("cLineas").checked ? layerLineas.addTo(map) : map.removeLayer(layerLineas);
  syncNombres();
  pintarMarcadores();
}

function pintarLista(){
  const box = document.getElementById("results");
  box.innerHTML = `<div id="resumen">${filtradas.length} propiedades · Región Metropolitana · datos al 19-jul-2026</div>`;
  [...filtradas].sort((a,b)=>a.precio-b.precio).forEach(c=>{
    const foto = c.fotos[0];
    const el = document.createElement("div");
    el.className = "card";
    el.innerHTML = `
      <div class="img" style="background-image:url('${foto}')">
        ${badge2(c.estado)}
        <span class="precio">${fmt(c.precio)}</span>
      </div>
      <div class="cbody">
        <div class="sector">${c.sector}</div>
        <div class="specs"><span>🛏️ ${c.dorm} dorm.</span><span>🚿 ${c.banos} baño${c.banos>1?"s":""}</span><span>📐 ${c.m2} m²</span></div>
        <div class="loco">🚌 Locomoción <b>${c.locomocion}/5</b> <span class="stars">${stars(c.locomocion)}</span> · 🚇 ${c.metro_cercano} (${c.metro_km} km)</div>
      </div>`;
    el.onclick = ()=>{ abrirFicha(c); map.flyTo([c.lat,c.lon], 16, {duration:.7}); };
    box.appendChild(el);
  });
}

const idx = {};
window.mover = (id,d)=>{
  const c = CASAS.find(x=>x.id===id);
  idx[id] = ((idx[id]||0)+d+c.fotos.length)%c.fotos.length;
  document.getElementById("f-img").src = c.fotos[idx[id]];
  document.getElementById("f-cnt").textContent = (idx[id]+1)+"/"+c.fotos.length;
};
function abrirFicha(c){
  idx[c.id] = 0;
  const fotos = c.fotos;
  document.getElementById("f-gal").innerHTML = fotos.length>1
    ? `<img id="f-img" src="${fotos[0]}">
       <button class="nav prev" onclick="mover(${c.id},-1)">‹</button>
       <button class="nav next" onclick="mover(${c.id},1)">›</button>
       <span class="cnt" id="f-cnt">1/${fotos.length}</span>`
    : `<img src="${fotos[0]}">`;
  const pct = c.locomocion/5*100;
  const precioM2 = Math.round(c.precio/c.m2);
  const valM2 = precioM2<=6000 ? 5 : precioM2<=7500 ? 4 : precioM2<=9000 ? 3 : precioM2<=10500 ? 2 : 1;
  document.getElementById("f-body").innerHTML = `
    <div class="precio">${fmt(c.precio)} <small>/mes</small></div>
    <div class="sector">${c.sector}</div>
    <div class="specs">
      <span>🛏️ ${c.dorm} dorm.</span><span>🚿 ${c.banos} baño${c.banos>1?"s":""}</span><span>📐 ${c.m2} m² útiles</span>
    </div>
    <div class="scorebox">
      <h4>Evaluación del sector (1–5)</h4>
      <div class="scorerow"><span class="lbl">🚌 Locomoción</span>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <span class="num">${c.locomocion}</span><span class="st stars">${stars(c.locomocion)}</span></div>
      <div class="scorerow"><span class="lbl">💰 Precio por m²</span>
        <div class="bar"><i style="width:${valM2/5*100}%"></i></div>
        <span class="num">${valM2}</span><span class="st stars">${stars(valM2)}</span></div>
      <div style="font-size:11px;color:var(--mut);margin-top:8px">
        🚇 Metro ${c.metro_cercano} a ${c.metro_km} km · 🚌 ${c.paraderos_400m} paraderos en 400 m · ${fmt(precioM2)}/m²
      </div>
    </div>
    ${c.calles && c.calles.length ? `<div class="calles"><b>Calles cercanas:</b><br>${c.calles.map(x=>`<span class="cl">${x}</span>`).join("")}</div>` : ""}
    ${c.nota ? `<div class="nota2">💡 ${c.nota}</div>` : ""}
    ${badge(c.estado)}
    <a class="btn" href="${c.link}" target="_blank" rel="noopener">Ver aviso completo →</a>
    <div class="corr">Publica: ${c.corr}</div>`;
  document.getElementById("ficha").classList.add("open");
}
window.cerrarFicha = ()=>document.getElementById("ficha").classList.remove("open");

let chipActivo = null;
const state = {dorm:1, banos:1};
function seg(el, tipo){
  const padre = el.parentElement;
  padre.querySelectorAll("button").forEach(b=>b.classList.remove("on"));
  el.classList.add("on");
  state[tipo] = +el.dataset.v;
  aplicar();
}
function chip(el, tipo){
  if (chipActivo===tipo){ chipActivo=null; el.classList.remove("on"); aplicar(); return; }
  chipActivo = tipo;
  document.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));
  el.classList.add("on");
  aplicar();
}
(function(){
  const conteo = {};
  CASAS.forEach(c=>{ const k = c.comuna||"Otra"; conteo[k]=(conteo[k]||0)+1; });
  const sel = document.getElementById("fComuna");
  Object.entries(conteo).sort((a,b)=>b[1]-a[1]).forEach(([k,n])=>{
    const o = document.createElement("option");
    o.value = k; o.textContent = `${k} (${n})`;
    sel.appendChild(o);
  });
})();
function aplicar(){
  const pMin = +document.getElementById("fPMin").value;
  let pMax = +document.getElementById("fPrecio").value;
  if (pMax < pMin){ document.getElementById("fPrecio").value = pMin; pMax = pMin; }
  const m2Min = +document.getElementById("fM2").value;
  const lMin = +document.getElementById("fLoco").value;
  const metroMax = +document.getElementById("fMetro").value;
  const comuna = document.getElementById("fComuna").value;
  document.getElementById("vPMin").textContent = pMin>=1000000 ? "$"+(pMin/1000000).toFixed(1).replace(".",",")+" M" : "$"+Math.round(pMin/1000)+" mil";
  document.getElementById("vPrecio").textContent = pMax>=1000000 ? "$"+(pMax/1000000).toFixed(1).replace(".",",")+" M" : "$"+Math.round(pMax/1000)+" mil";
  document.getElementById("vM2").textContent = m2Min+" m²";
  document.getElementById("vLoco").textContent = lMin+"+ ★";
  filtradas = CASAS.filter(c=>
    c.precio>=pMin && c.precio<=pMax &&
    c.dorm>=state.dorm && c.banos>=state.banos &&
    c.m2>=m2Min && c.locomocion>=lMin &&
    c.metro_km<=metroMax &&
    (!comuna || c.comuna===comuna) &&
    (!document.getElementById("aEstac").checked || c.amen.estac) &&
    (!document.getElementById("aMascotas").checked || c.amen.mascotas) &&
    (!document.getElementById("aPiscina").checked || c.amen.piscina) &&
    (!document.getElementById("aCondo").checked || c.amen.condominio) &&
    (!document.getElementById("aVerif").checked || c.estado==="verificado") &&
    (!document.getElementById("aFotos").checked || c.fotos.some(f=>f.startsWith("https")))
  );
  if (chipActivo==="baratas") filtradas = filtradas.filter(c=>c.precio<=500000);
  if (chipActivo==="locomocion") filtradas = filtradas.filter(c=>c.locomocion>=4);
  if (chipActivo==="metros") filtradas = filtradas.filter(c=>c.m2>=90);
  if (chipActivo==="verificadas") filtradas = filtradas.filter(c=>c.estado==="verificado");
  if (chipActivo==="4d") filtradas = filtradas.filter(c=>c.dorm>=4);
  pintarLista(); pintarMarcadores();
}
function limpiar(){
  document.getElementById("fPMin").value = 350000;
  document.getElementById("fPrecio").value = 1800000;
  document.getElementById("fM2").value = 40;
  document.getElementById("fLoco").value = 1;
  document.getElementById("fMetro").value = 99;
  document.getElementById("fComuna").value = "";
  document.getElementById("q").value = "";
  ["aEstac","aMascotas","aPiscina","aCondo","aVerif","aFotos"].forEach(id=>document.getElementById(id).checked=false);
  state.dorm = 1; state.banos = 1;
  document.querySelectorAll(".seg button").forEach(b=>b.classList.remove("on"));
  document.querySelector('#segDorm button[data-v="1"]').classList.add("on");
  document.querySelector('#segBanos button[data-v="1"]').classList.add("on");
  chipActivo = null;
  document.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));
  aplicar();
}

function buscar(){
  const q = document.getElementById("q").value.toLowerCase().trim();
  limpiar();
  if (!q){ return; }
  let pMax = 1800000, dMin = 1, lMin = 1;
  const mPrecio = q.match(/(\d{3}(?:[\.\,]\d{3})?)\s*(mil)?/);
  if (mPrecio){
    let n = parseInt(mPrecio[1].replace(/[\.\,]/g,""));
    if (mPrecio[2]==="mil" || n<=900) n = n*1000;
    if (n>=300000 && n<=1800000) pMax = n;
  }
  const mDorm = q.match(/(\d)\s*(dorm|pieza|habitacion)/);
  if (mDorm) dMin = +mDorm[1];
  if (/locomoci[oó]n|metro|cercano a metro|bien ubicada|conectividad/.test(q)) lMin = 3.5;
  document.getElementById("fPrecio").value = pMax;
  state.dorm = dMin;
  document.querySelectorAll("#segDorm button").forEach(b=>b.classList.toggle("on", +b.dataset.v===Math.min(dMin,4)));
  document.getElementById("fLoco").value = lMin;
  aplicar();
  if (filtradas.length===CASAS.length || /bajos|mena|protectora|sotero|sótero|mercedes|plaza viva|san carlos|eyzaguirre|tobalaba|raco|nieves|casas viejas|elisa correa|florida|maip[uú]|bernard|peñalol|condes|providencia|ñuñoa|nunoa|santiago|macul|granja|navia|huechuraba|quilicura|colina|buin|paine|pudahuel/.test(q)){
    const term = q.replace(/hasta|mil|dormitorios?|piezas?|casas?|arriendo|con|de|en|y|\d/g," ").trim().split(/\s+/).filter(w=>w.length>3);
    if (term.length){
      const porTexto = CASAS.filter(c=>{
        const blob = (c.sector+" "+(c.comuna||"")+" "+(c.calles||[]).join(" ")+" "+c.nota+" "+c.metro_cercano).toLowerCase();
        return term.some(w=>blob.includes(w));
      });
      if (porTexto.length){
        const pM = +document.getElementById("fPrecio").value, dM = state.dorm, lM = +document.getElementById("fLoco").value;
        filtradas = porTexto.filter(c=>c.precio<=pM && c.dorm>=dM && c.locomocion>=lM);
        pintarLista(); pintarMarcadores();
      }
    }
  }
}
window.buscar = buscar;
window.aplicar = aplicar;
window.limpiar = limpiar;
window.seg = seg;
window.chip = chip;
window.capas = capas;
document.getElementById("q").addEventListener("keydown", e=>{ if(e.key==="Enter") buscar(); });

aplicar();
}
</script>
</body>
</html>
